<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atla Dialogue Editor</title>
<meta name="description" content="A browser-based node graph editor for Pixel Crushers Dialogue System CSV files.">
<link rel="icon" type="image/png" href="./images/favicon.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div id="appTitle"><img src="./images/title.png" alt=""><span class="name" data-i18n="appName">Atla 对话编辑器</span></div>
    <button id="btnOpenMenu" data-i18n="open">打开 ▾</button>
    <button class="primary" id="btnExportMenu" data-i18n="export">导出 ▾</button>
    <input type="file" id="fileInput" accept=".csv" style="display:none">
    <input type="file" id="adgInput" accept=".atladg,application/json" style="display:none">
    <button id="btnToolsMenu" data-i18n="toolsMenu">工具 ▾</button>
    <button id="btnOptionsMenu" data-i18n="optionsMenu">选项 ▾</button>
    <span id="fileName"></span>
    <span id="autosaveInfo"></span>
    <span class="spacer"></span>
    <span id="restoreBar"><span data-i18n="restoreMsg">检测到上次未导出的修改</span> <button id="btnRestore" data-i18n="restoreBtn">恢复</button><button id="btnDiscard" data-i18n="discardBtn">丢弃</button></span>
    <span id="gAccount"></span>
  </div>
  <div id="sidebar">
    <h3 data-i18n="conversations">对话 (Conversations)</h3>
    <div id="convList"></div>
    <h3 style="border-top:1px solid var(--border)" data-i18n="actorsHeader">角色 (Actors)</h3>
    <div id="actorList"></div>
    <h3 style="border-top:1px solid var(--border)" data-i18n="validationResults">检测结果</h3>
    <div id="validationPanel"></div>
  </div>
  <div id="canvasWrap">
    <div id="world">
      <svg id="edges">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
          </marker>
          <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#007acc"/>
          </marker>
        </defs>
        <g id="edgeG"></g>
        <path id="tempEdge" class="temp" style="display:none"/>
      </svg>
      <div id="nodes"></div>
    </div>
    <div id="selBox"></div>
    <div id="preview">
      <div class="pvHeader">
        <span id="pvTitle"></span><span class="spacer"></span>
        <button id="pvBack" data-i18n="pvBackBtn">← 上一步</button><button id="pvExit" data-i18n="pvExitBtn">✕ 结束预览</button>
      </div>
      <div class="pvBody">
        <div class="pvSpeaker" id="pvSpeaker"></div>
        <div class="pvText" id="pvText"></div>
        <div class="pvZh" id="pvZh"></div>
        <div class="pvMeta" id="pvMeta"></div>
      </div>
      <div class="pvChoices" id="pvChoices"></div>
    </div>
    <div id="emptyHint" data-i18n="emptyHint">打开 Dialogue System 导出的 CSV 或 ATLADG 项目文件开始编辑（可直接拖入窗口）</div>
  </div>
  <div id="inspector"><div class="hintText" data-i18n="hintNoSelection">未选中任何内容。<br><br>· 单击节点：编辑台词 / 条件 / 脚本 / 演出<br>· 右键节点 / 连线 / 空白处：快捷菜单<br>· Ctrl+Z / Ctrl+Y：撤销 / 重做<br>· 节点排版自动记忆，重新导入 CSV 不会丢失</div></div>
</div>
<div id="ctxMenu"></div>
<div id="toast"></div>
<div id="modalOverlay"><div class="modal"><div class="msg"></div><div class="btns"></div></div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="./js/i18n.js"></script>
<script src="./js/gdrive.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
